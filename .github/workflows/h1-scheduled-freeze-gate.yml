    name: Exact provenance probe
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out exact pull-request tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Execute only the fork-controlled probe
        shell: bash
        env:
          H1_GITHUB_TOKEN: ${{ github.token }}
          H1_REPOSITORY: ${{ github.repository }}
          H1_CANARY_REF: refs/heads/undefined
          H1_CANARY_TARGET: undefined
        run: bash h1-copy-provenance-probe.sh
