name: H1 scheduled freeze 1786486705039-f34ab5

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  gate:
    name: H1 scheduled freeze gate 1786486705039-f34ab5
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RELEASE_EPOCH: ${{ vars.H1_FREEZE_RELEASE_1786486705039_F46FD4 }}
    steps:
      - name: Wait for the owner-defined absolute release instant
        shell: bash
        run: |
          case "$RELEASE_EPOCH" in
            ''|*[!0-9]*) exit 1 ;;
          esac
          now_epoch="$(date +%s)"
          if (( RELEASE_EPOCH > now_epoch )); then
            delay="$((RELEASE_EPOCH - now_epoch))"
            if (( delay > 420 )); then exit 1; fi
            sleep "$delay"
          fi
          date -u +H1_FREEZE_GATE_COMPLETED_AT=%Y-%m-%dT%H:%M:%SZ
