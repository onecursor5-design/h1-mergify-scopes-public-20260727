name: h1lab-fork-read-token-ci-trace

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  upload-fork-junit:
    if: >-
      github.event.pull_request.head.repo.fork == true &&
      startsWith(github.event.pull_request.title, 'h1lab fork read trace')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require the bounded fork fixture
        run: test -f h1lab-fork-trace.xml

      - name: Install the exact Mergify CLI
        uses: Mergifyio/setup-cli@v1
        with:
          mergify_cli_version: 2026.7.21.1

      - name: Upload with the read-only pull-request token
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MERGIFY_TEST_JOB_NAME: h1lab-fork-read-token-job
        run: >-
          mergify ci junit-process
          --color never
          --repository "${{ github.repository }}"
          --tests-target-branch "${{ github.base_ref }}"
          --test-framework h1lab
          --test-language javascript
          h1lab-fork-trace.xml
